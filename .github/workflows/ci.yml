name: CI

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  linux-package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: buggcraft-translation-deb
          path: dist/*.deb

  windows-package:
    needs: test
    runs-on: windows-2022
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - shell: pwsh
        run: ./scripts/build_windows.ps1
      - shell: pwsh
        id: service_smoke
        run: ./scripts/smoke_windows_service.ps1
      - uses: actions/github-script@v7
        if: failure() && steps.service_smoke.outcome == 'failure'
        with:
          script: |
            const fs = require('fs');
            const path = 'dist/service-smoke.log';
            const details = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'No service diagnostics were produced.';
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Windows service diagnostics',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'neutral',
              output: { title: 'Windows service startup diagnostics', summary: '```text\n' + details.slice(0, 12000) + '\n```' }
            });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mc-translate-windows
          path: dist/mc-translate-windows.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mc-translate-windows-diagnostics
          path: dist/service-smoke.log
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-package, windows-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: buggcraft-translation-deb
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: mc-translate-windows
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
