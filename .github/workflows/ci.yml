name: CI

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  linux-package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: buggcraft-translation-deb
          path: dist/*.deb

  windows-package:
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - shell: pwsh
        run: ./scripts/build_windows.ps1
      - shell: pwsh
        run: ./scripts/smoke_windows_service.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: mc-translate-windows
          path: dist/mc-translate-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-package, windows-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: buggcraft-translation-deb
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: mc-translate-windows
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
