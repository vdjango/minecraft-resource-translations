<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开发者接入申请 · Buggcraft Translate</title><script src="/assets/theme.js?v=20261025-layout2"></script><link rel="stylesheet" href="/assets/style.css?v=20261025-layout2"><script type="module" src="/assets/vue-page-developers.js?v=17c73ecc1587"></script></head><body><nav><a class="brand" href="/">BUGGCRAFT / TRANSLATE</a><div class="nav-links"><a href="/docs">接口文档</a></div></nav><main class="docs"><h1>申请启动器接入密钥</h1><p>公开资源查询、译文读取和个人试用不需要密钥。申请密钥用于给正式启动器分配独立生成额度、统计用量和管理停用；模型供应商密钥绝不会发给接入方。</p><form id="application"><label>启动器 / 应用名称<input id="name" maxlength="100" required></label><label>维护者联系信息<input id="contact" maxlength="200" required placeholder="邮箱或公开主页"></label><label>项目主页（可选）<input id="website" type="text" maxlength="500" placeholder="支持 HTTP、HTTPS 或其他主页地址"></label><label>接入用途与预计用户规模<textarea id="purpose" maxlength="1000" required></textarea></label><button>提交申请并生成待审批凭据</button></form><p id="message" role="status" aria-live="polite"></p><section id="result" class="hidden"><h2>待审批凭据</h2><p>密钥只显示这一次，请先安全保存。批准前不能创建翻译任务；无需密钥的只读接口仍可直接访问。</p><pre id="issued-key"></pre></section><section id="status-section"><h2>查询审批状态</h2><form id="status-form"><label>申请时保存的接入密钥<input id="status-key" type="password" autocomplete="off" required></label><button>查询状态</button></form><p id="application-status" role="status" aria-live="polite"></p></section><p><a href="/docs">查看多语言接入文档 →</a></p></main></body></html>
