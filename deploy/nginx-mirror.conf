# Include only in the mirror.bugg.icu server block alongside nginx.conf.
# The existing translation vhost remains unchanged.
location ^~ /_internal/ { return 404; }
location ^~ /_mirror_node/ {
    proxy_pass http://127.0.0.1:18449;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 1800s;
}
location ~ ^/(?:assets/[a-f0-9]{2}/[a-f0-9]{40}$|java/|mods/|mc/game/|v1/(?:packages/|objects/|products/java-runtime/)|maven/|fabric-meta/|fabric-maven/|neoforge-maven/|quilt-meta/|quilt-maven/|mirrors/authlib-injector/) {
    proxy_pass http://127.0.0.1:18449;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_read_timeout 1800s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
}
