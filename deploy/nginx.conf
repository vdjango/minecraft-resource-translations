# Include only inside the translate.bugg.icu server blocks.
# The deployment script obtains and validates Cloudflare's published proxy ranges
# for real client IPs. Never trust CF-Connecting-IP from arbitrary origins.
client_max_body_size 64k;
gzip on;
gzip_types application/json text/css application/javascript;
gzip_min_length 1024;

location /.well-known/acme-challenge/ {
    root /var/lib/buggcraft-translation/acme;
}
location / {
    proxy_pass http://127.0.0.1:18448;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 150s;
    proxy_buffering on;
}
location = /v1/events {
    proxy_pass http://127.0.0.1:18448;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_read_timeout 150s;
    proxy_buffering off;
}
