[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-translation-platform"
version = "0.1.6"
description = "Shared, versioned Minecraft resource translations"
license = {file = "LICENSE"}
keywords = ["minecraft", "translation", "launcher", "federation"]
classifiers = ["Development Status :: 5 - Production/Stable", "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Topic :: Internet :: WWW/HTTP :: HTTP Servers"]
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.11,<4", "aiosqlite>=0.21,<1", "bleach>=6.2,<7", "jsonschema>=4.23,<5", "markdown-it-py>=3,<5"]

[project.optional-dependencies]
build = ["pyinstaller>=6.10,<7"]
windows = ["pywin32>=306; platform_system == 'Windows'"]
qiniu = ["qiniu>=7.18,<8"]
s3 = ["boto3>=1.36,<2"]
acme = ["certbot>=4,<6", "certbot-dns-cloudflare>=4,<6"]

[project.scripts]
mc-translate = "mc_translate.__main__:main"
mc-mirror = "mc_translate.mirror:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mc_translate = ["public-seo.json", "web/*", "web/examples/*", "contracts/*"]
